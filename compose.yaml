# Run the website on your own server:
#
#     docker compose up -d --build
#
# then open http://<server>:8000. To update after a git pull, run the same command again.
#
# To make it public with Cloudflare Tunnel, copy .env.example to .env and paste in your tunnel token (see README).
services:
  web:
    build: .
    image: btc-price-predictor
    container_name: btc-price-predictor
    restart: unless-stopped
    ports:
      - "8000:8000"  # for the home network; the tunnel does not need it
    healthcheck:
      # Checks the stylesheet, not the front page, so health checks don't count as visitors
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/static/style.css', timeout=5)"]
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3

  tunnel:
    # Only runs when COMPOSE_PROFILES=tunnel, which .env sets
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.9.3
    container_name: btc-price-predictor-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web
